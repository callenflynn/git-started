name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────── Compute version ────────────────────

  prepare:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.version.outputs.COUNT }}
      sha: ${{ steps.version.outputs.SHA }}
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          echo "COUNT=${COUNT}" >> $GITHUB_OUTPUT
          echo "SHA=${SHA}" >> $GITHUB_OUTPUT
          echo "TAG=${SHA}" >> $GITHUB_OUTPUT
          echo "VERSION=0.0.0-${COUNT}" >> $GITHUB_OUTPUT

  # ──────────────────── Platform builds ────────────────────

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-macos-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: node scripts/set-version.mjs
        env:
          FORCE_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign DMG for auto-updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            FILE=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
            if [ -n "$FILE" ]; then
              npx @tauri-apps/cli signer sign "$FILE" \
                > src-tauri/target/universal-apple-darwin/release/bundle/dmg/signature.txt
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/signature.txt
          retention-days: 30

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-linux-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: node scripts/set-version.mjs
        env:
          FORCE_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign AppImage for auto-updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            FILE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
            if [ -n "$FILE" ]; then
              npx @tauri-apps/cli signer sign "$FILE" \
                > src-tauri/target/release/bundle/appimage/signature.txt
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/signature.txt
          retention-days: 30

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-windows-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: node scripts/set-version.mjs
        env:
          FORCE_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign EXE for auto-updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
            if [ -n "$FILE" ]; then
              npx @tauri-apps/cli signer sign "$FILE" \
                > src-tauri/target/release/bundle/nsis/signature.txt
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/signature.txt
          retention-days: 30

  # ──────────────────── Release ────────────────────

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [prepare, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updates.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          BASE="https://github.com/Notsk/git-started/releases/download/${{ needs.prepare.outputs.tag }}"

          SIGNATURE=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -f artifacts/signature.txt ]; then
            SIGNATURE=$(cat artifacts/signature.txt)
          fi

          cat > updates.json << EOF
          {
            "version": "${VER}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${BASE}/$(ls artifacts/*-setup.exe 2>/dev/null | xargs -n1 basename)"
              },
              "darwin-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${BASE}/$(ls artifacts/*.dmg 2>/dev/null | xargs -n1 basename)"
              },
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "${BASE}/$(ls artifacts/*.dmg 2>/dev/null | xargs -n1 basename)"
              },
              "linux-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${BASE}/$(ls artifacts/*.AppImage 2>/dev/null | xargs -n1 basename)"
              }
            }
          }
          EOF
          mv updates.json artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.sha }}
          body: |
            Build `${{ needs.prepare.outputs.sha }}` — version `${{ needs.prepare.outputs.version }}`

            ### Windows

            - **`*-setup.exe`** — NSIS installer. Recommended for most users.
            - **`*.msi`** — MSI installer. For managed deployments.

            ### macOS

            - **`*.dmg`** — Disk image. Drag to Applications. Right-click → Open on first launch.

            ### Linux

            - **`*.deb`** — For Debian / Ubuntu / Mint / Pop!_OS.
            - **`*.AppImage`** — Portable, any distro. `chmod +x && ./<file>`.

            > Auto-updater is active for NSIS (Windows), DMG (macOS), and AppImage (Linux).
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/updates.json
